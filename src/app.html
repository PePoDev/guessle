<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Solve Guessle, a daily 3-digit number puzzle with colored tile clues, or play Random rounds with digit and position hints. Play solo, pass-and-play, or online with friends, in Thai or English."
		/>
		<meta name="theme-color" content="#1d4ed8" />
		<title>Guessle: Daily Number Puzzle</title>
		<link rel="canonical" href="https://guessle.pepo.dev/" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Link crawlers never run the app, so every preview tag lives in this static page. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Guessle" />
		<meta property="og:url" content="https://guessle.pepo.dev/" />
		<meta property="og:title" content="Guessle: Daily Number Puzzle" />
		<meta
			property="og:description"
			content="Guess today's 3-digit number in 6 tries. Everyone gets the same one. ทายเลข 3 หลักของวันนี้ให้ถูกภายใน 6 ครั้ง ทุกคนได้เลขเดียวกัน"
		/>
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="th_TH" />
		<meta property="og:image" content="https://guessle.pepo.dev/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Guessle wordmark over three clue tiles, a grey 1, a yellow 2, and a green 3, with “Guess today’s 3-digit number in 6 tries.” in English and Thai." />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400..700&family=Space+Grotesk:wght@700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
