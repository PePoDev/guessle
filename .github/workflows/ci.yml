name: Online tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: online-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Functions
        run: pnpm test:functions

      - name: Test Firebase rules and transactions
        run: pnpm test:firebase

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run online E2E tests
        run: pnpm test:e2e:online

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: online-test-results
          path: playwright-report/
          retention-days: 7
