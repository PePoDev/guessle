name: Deploy Firebase Backend

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Functions
        run: pnpm test:functions

      - name: Test Firebase rules and transactions
        run: pnpm test:firebase

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Generated here, never committed: the Firebase CLI reads
      # functions/.env.<project id> for this project's deploy only.
      - name: Write Functions environment
        env:
          ENFORCE_APP_CHECK: ${{ vars.ENFORCE_APP_CHECK || 'false' }}
          PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          case "$ENFORCE_APP_CHECK" in
            true | false) ;;
            *)
              echo "::error::ENFORCE_APP_CHECK must be true or false"
              exit 1
              ;;
          esac
          printf 'ENFORCE_APP_CHECK=%s\n' "$ENFORCE_APP_CHECK" > "functions/.env.$PROJECT_ID"

      # --force lets the CLI set the Artifact Registry cleanup policy and remove
      # functions deleted from the source instead of stopping at a prompt. It
      # also deletes Firestore indexes and field overrides (TTL policies too)
      # that firestore.indexes.json does not list, so they must live there.
      - name: Deploy Firebase backend
        run: >
          pnpm firebase deploy
          --project "${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}"
          --only functions,firestore:rules,firestore:indexes
          --non-interactive
          --force
