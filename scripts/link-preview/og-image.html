<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Guessle share image</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400..700&family=Space+Grotesk:wght@700&display=swap"
			rel="stylesheet"
		/>
		<!-- The app's own tokens and tile styles; its Tailwind-only rules are skipped outside the build. -->
		<link rel="stylesheet" href="../../src/app.css" />
		<style>
			:root {
				--font-display: 'Space Grotesk', 'Noto Sans Thai', system-ui, sans-serif;
				--font-body: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
				--font-thai: 'Noto Sans Thai', 'Inter', system-ui, sans-serif;
				/* Twice the app's line weight, so borders survive the platforms' downscaling. */
				--line: 3px;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}

			body {
				position: relative;
				background-color: var(--stage-bg);
				background-image:
					linear-gradient(to right, var(--stage-grid) 1.5px, transparent 1.5px),
					linear-gradient(to bottom, var(--stage-grid) 1.5px, transparent 1.5px);
				background-size: 24px 24px;
				color: var(--glass-fg);
				font-family: var(--font-body);
				-webkit-font-smoothing: antialiased;
			}

			.frame {
				position: absolute;
				inset: 18px;
				border: var(--line) solid var(--stage-border);
				border-radius: 26px;
				overflow: hidden;
			}

			.ticker {
				position: absolute;
				inset: 0 0 auto 0;
				display: flex;
				align-items: center;
				justify-content: center;
				height: 50px;
				border-bottom: var(--line) solid var(--stage-border);
				background: var(--ticker-bg);
				color: var(--ticker-fg);
				font-family: var(--font-display);
				font-size: 19px;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				white-space: nowrap;
			}

			/* Caught mid-run, with Daily Guessle just left of center. */
			.ticker-track {
				display: flex;
				align-items: center;
				transform: translateX(-4px);
			}

			.ticker .th {
				font-family: var(--font-thai);
				font-weight: 600;
				letter-spacing: 0.02em;
			}

			.ticker .star {
				padding: 0 0.6em;
			}

			/* The play panel is the hero; it keeps the wordmark, tiles, and tagline inside a centered square crop. */
			.card {
				position: absolute;
				inset: 70px 186px 40px;
				z-index: 2;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				padding-bottom: 14px;
				border: var(--line) solid var(--stage-border);
				border-radius: 28px;
				background: var(--glass-bg);
			}

			/* Nav cards tucked behind the panel, outside the square crop. */
			.mode {
				position: absolute;
				z-index: 1;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				width: 190px;
				height: 230px;
				padding: 14px 16px;
				border: var(--line) solid var(--stage-border);
				border-radius: 16px;
				font-family: var(--font-display);
				font-weight: 700;
			}

			.mode .num {
				font-size: 28px;
				line-height: 1;
			}

			.mode .label {
				font-family: var(--font-body);
				font-size: 22px;
				font-weight: 600;
				line-height: 1.15;
			}

			.mode.blue {
				top: 104px;
				left: 18px;
				background: var(--accent-blue);
				color: var(--accent-blue-fg);
				transform: rotate(-6deg);
			}

			.mode.yellow {
				top: 252px;
				right: 16px;
				background: var(--accent-yellow);
				color: var(--accent-yellow-fg);
				text-align: right;
				transform: rotate(6deg);
			}

			.wordmark {
				color: var(--glass-fg);
				font-family: var(--font-display);
				font-size: 128px;
				font-weight: 700;
				line-height: 1.28;
				letter-spacing: -0.01em;
			}

			.wordmark em {
				padding: 0 0.2em;
				border-radius: 0.2em;
				background: var(--stage-border);
				color: var(--glass-accent);
				font-style: italic;
			}

			.row {
				--tile: 108px;
				--i: 0;
				display: flex;
				gap: 14px;
			}

			.tagline {
				text-align: center;
			}

			.tagline .en {
				font-size: 30px;
				font-weight: 600;
				line-height: 1.3;
			}

			.tagline .th {
				color: var(--glass-muted);
				font-family: var(--font-thai);
				font-size: 28px;
				font-weight: 500;
				line-height: 1.5;
			}

			.domain {
				position: absolute;
				bottom: -25px;
				left: 50%;
				padding: 5px 24px 7px;
				border-radius: 999px;
				background: var(--stage-border);
				color: var(--ticker-fg);
				font-family: var(--font-display);
				font-size: 28px;
				font-weight: 700;
				letter-spacing: 0.02em;
				white-space: nowrap;
				transform: translateX(-50%);
			}
		</style>
	</head>
	<body>
		<div class="frame">
			<div class="ticker">
				<div class="ticker-track">
					<span class="th">เล่นหลายคนในเครื่องเดียว</span><span class="star">✦</span>
					<span>Online rooms</span><span class="star">✦</span>
					<span>Guess the number</span><span class="star">✦</span>
					<span class="th">ทายตัวเลข</span><span class="star">✦</span>
					<span>Daily Guessle</span><span class="star">✦</span>
					<span class="th">Guessle รายวัน</span><span class="star">✦</span>
					<span>2–5 digits</span><span class="star">✦</span>
					<span class="th">2–5 หลัก</span><span class="star">✦</span>
					<span>3–20 attempts</span><span class="star">✦</span>
				</div>
			</div>
			<div class="mode blue"><div class="num">01</div><div class="label">Single<br />player</div></div>
			<div class="mode yellow"><div class="num">02</div><div class="label">Multiplayer</div></div>
			<div class="card">
				<h1 class="wordmark">Guess<em>le.</em></h1>
				<!-- An illustrative guess of 123 against 273, scored by the game's rules. -->
				<div class="row">
					<span class="tile mark-absent">1</span>
					<span class="tile mark-present">2</span>
					<span class="tile mark-correct">3</span>
				</div>
				<div class="tagline">
					<p class="en">Guess today’s 3-digit number in 6 tries.</p>
					<p class="th" lang="th">ทายเลข 3 หลักของวันนี้ให้ถูกภายใน 6 ครั้ง</p>
				</div>
				<div class="domain">guessle.pepo.dev</div>
			</div>
		</div>
	</body>
</html>
